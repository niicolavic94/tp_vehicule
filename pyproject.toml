[project]
name = "vehicule"
version = "0.1.0"
description = ""
authors = [
    {name = "niicolavic94", email = "nicoredon94@gmail.com"}
]
readme = "README.md"
requires-python = "^3.14"
dependencies = [
    "mysql-connector-python (>=26.7.0,<27.0.0)",
    "pydocstyle (>=6.3.0,<7.0.0)",
    "sphinx (>=9.1.0,<10.0.0)",
    "mkdocs (>=1.6.1,<2.0.0)",
    "mkdocs-material (>=9.7.7,<10.0.0)",
    "mkdocstrings (>=1.0.7,<2.0.0)",
    "fastapi (>=0.143.0,<0.144.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]